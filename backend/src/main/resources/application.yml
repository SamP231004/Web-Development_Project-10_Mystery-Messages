server:
  port: ${PORT:8080}

spring:
  application:
    name: mystery-messages-api
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/test}
      database: ${MONGODB_DATABASE:test}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:${NEXTAUTH_SECRET:change-me-in-production}}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Mystery Messages <onboarding@resend.dev>}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
